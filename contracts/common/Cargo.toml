[package]
name = "sendam-contract-common"
version = "0.1.0"
edition = "2021"
description = "Common governance, upgrade, and security primitives for SendAm Soroban contracts"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "22.0.0", default-features = false }

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
