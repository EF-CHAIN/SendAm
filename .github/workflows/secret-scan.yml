name: Secret Scan

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  gitleaks-self-test:
    name: Gitleaks self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.18.4"
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar xz -C /usr/local/bin gitleaks

      - name: Verify scanner catches seeded fake secrets
        run: |
          set -euo pipefail

          TMPDIR="$(mktemp -d)"
          trap 'rm -rf "$TMPDIR"' EXIT

          # Seed a file with fake secrets that match our rule patterns.
          cat > "$TMPDIR/fake-secrets.env" <<'SECRETS'
          # Seeded fake secrets — proves gitleaks catches real patterns.
          STELLAR_SECRET_KEY=SAAAAFAKESECRET1234567890ABCDEFGHIJKLMNO
          DATABASE_URL=postgresql://sendam:hunter2_real_password@db.example.com:5432/sendam
          API_KEY=sk-proj-abcdefghijklmnopqrstuvwxyz123456
          SECRETS

          # Gitleaks must find at least one secret (exit code 1).
          if gitleaks detect --source="$TMPDIR" --no-banner --redact 2>&1; then
            echo "::error::Self-test FAILED — gitleaks passed on a file containing fake secrets"
            exit 1
          fi

          echo "Self-test passed — gitleaks correctly detected seeded fake secrets"

  gitleaks:
    name: Gitleaks scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
