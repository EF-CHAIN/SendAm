name: Scheduled Load Test Regression

on:
  schedule:
    # Run weekly at 03:00 UTC on Sunday
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Duration in seconds per scenario'
        required: false
        default: '10'

jobs:
  load-test-regression:
    name: Load test budget regression check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sendam_load_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sendam_load_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:password@localhost:5432/sendam_load_test
      REDIS_URL: redis://localhost:6379
      PORT: 3002
      JWT_SECRET: load-test-jwt-secret-at-least-32-chars-long
      ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
      PIN_PEPPER: load-test-pin-pepper-32-bytes-minimum

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Verify isolated environment safety
        run: |
          if [ "$NODE_ENV" = "production" ]; then
            echo "ERROR: Refusing to run load test with NODE_ENV=production"
            exit 1
          fi
          echo "Confirmed load test is running in an isolated test container environment."

      - name: Setup Database
        run: |
          npm run prisma:generate --workspace=apps/api
          npm run prisma:deploy --workspace=apps/api

      - name: Run Load Test Budget Suite
        working-directory: apps/api
        run: |
          node test/load.budgets.test.js > load_test_output.log 2>&1 || {
            cat load_test_output.log
            exit 1
          }
          cat load_test_output.log

      - name: Publish Result Summary
        if: always()
        run: |
          echo "## 📊 Load Test Budget Regression Results" >> $GITHUB_STEP_SUMMARY
          echo "Ran payment-critical load harness scenarios against isolated PostgreSQL and Redis service containers." >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat apps/api/load_test_output.log | tail -n 40 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
