name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sendam_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Generate the Prisma client.
      - run: npm run prisma:generate --workspace=apps/api
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/sendam_test
      # Validate database migrations against a clean Postgres instance. Run it
      # through the workspace, not with --schema from the repo root: prisma
      # discovers datasource.url from apps/api/prisma.config.ts, and from the
      # root that file is never loaded — "The datasource.url property is
      # required in your Prisma config file when using prisma migrate deploy".
      - run: npm run prisma:deploy --workspace=apps/api
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/sendam_test
      # Unit tests (parser, crypto, admin auth, transfer guardrails, recipient
      # resolution, validators)
      - run: npm test

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Build both Vite frontends so a compile break in either app fails the
      # check and blocks the merge, exactly like a failing test.
      - run: npm run build:landing
      - run: npm run build:admin
