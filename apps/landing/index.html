<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SendAm" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <title>SendAm | Send money like you send a text</title>
    <meta
      name="description"
      content="SendAm turns WhatsApp into a Stellar wallet. Create an account, check your balance, and send XLM, all from a chat, no app required."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SendAm" />
    <meta property="og:title" content="SendAm | Send money like you send a text" />
    <meta
      property="og:description"
      content="WhatsApp-first payments powered by the Stellar network. Create a wallet and send XLM from a chat."
    />
    <meta property="og:image" content="/logo-sent.svg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SendAm | Send money like you send a text" />
    <meta
      name="twitter:description"
      content="WhatsApp-first payments powered by the Stellar network. Create a wallet and send XLM from a chat."
    />
    <meta name="twitter:image" content="/logo-sent.svg" />

    <!-- Structured data (schema.org JSON-LD): corporate identity, payment service, corridors, support -->
    <script type="application/ld+json" id="sendam-structured-data">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://send-am-web.vercel.app/#organization",
            "name": "SendAm",
            "url": "https://send-am-web.vercel.app/",
            "logo": "https://send-am-web.vercel.app/icons/icon-512x512.png",
            "description": "SendAm turns WhatsApp into a Stellar wallet so people can send and receive money from a chat, with no app to install.",
            "sameAs": ["https://github.com/Gozirimdev/SendAm"],
            "contactPoint": [
              {
                "@type": "ContactPoint",
                "contactType": "customer support",
                "url": "https://send-am-web.vercel.app/#faq",
                "availableLanguage": ["English"]
              }
            ]
          },
          {
            "@type": "FinancialService",
            "@id": "https://send-am-web.vercel.app/#service",
            "name": "SendAm cross-border money transfer",
            "serviceType": "Cross-border money transfer",
            "description": "WhatsApp-first payments on the Stellar network with a flat 1% fee.",
            "url": "https://send-am-web.vercel.app/",
            "image": "https://send-am-web.vercel.app/logo-sent.svg",
            "provider": { "@id": "https://send-am-web.vercel.app/#organization" },
            "feesAndCommissionsSpecification": "https://send-am-web.vercel.app/#calculator",
            "priceRange": "1% flat fee",
            "currenciesAccepted": "USD, EUR, GBP",
            "areaServed": [
              { "@type": "Country", "name": "Nigeria", "identifier": "NG" },
              { "@type": "Country", "name": "Kenya", "identifier": "KE" },
              { "@type": "Country", "name": "Ghana", "identifier": "GH" }
            ],
            "availableChannel": {
              "@type": "ServiceChannel",
              "name": "WhatsApp chat",
              "serviceUrl": "https://send-am-web.vercel.app/"
            }
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
