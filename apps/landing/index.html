    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SendAm" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SendAm" />

      property="og:description"
      content="WhatsApp-first payments powered by the Stellar network. Create a wallet and send XLM from a chat."
    />
    <meta
      property="og:image"
      content="https://send-am-web.vercel.app/social-preview.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SendAm logo on a light teal background" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SendAm | Send money like you send a text" />
    <meta
      name="twitter:description"
      content="WhatsApp-first payments powered by the Stellar network. Create a wallet and send XLM from a chat."

      name="twitter:image"
      content="https://send-am-web.vercel.app/social-preview.png"
    />

    <!--
      Self-hosted Latin subsets of Inter (body) and Outfit (headings), both
      variable weight 100-900, from Fontsource 5.3.0 (SIL OFL 1.1, see
      public/fonts). Preloading lets the browser fetch them in parallel with
      the bundle; font-display: swap paints text immediately in a metric-matched
      fallback, so there is no invisible text and no reflow when they arrive.
    -->
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/outfit-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Inter';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/inter-latin-wght-normal.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'Outfit';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/outfit-latin-wght-normal.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
      }
      /*
        Fallback faces scaled to each web font's average glyph width and
        vertical metrics (computed against Arial-compatible metrics), so the
        swap does not move text. Values match docs in apps/landing/README.md.
      */
      @font-face {
        font-family: 'Inter Fallback';
        src: local('Arial'), local('Liberation Sans'), local('Helvetica');
        size-adjust: 106.92%;
        ascent-override: 90.6%;
        descent-override: 22.56%;
        line-gap-override: 0%;
      }
      @font-face {
        font-family: 'Outfit Fallback';
        src: local('Arial'), local('Liberation Sans'), local('Helvetica');
        size-adjust: 98.53%;
        ascent-override: 101.49%;
        descent-override: 26.39%;
        line-gap-override: 0%;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
