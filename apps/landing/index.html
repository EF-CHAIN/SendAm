<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d9488" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SendAm" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <title>SendAm | Send money like you send a text</title>
    <meta
      name="description"
      content="SendAm turns WhatsApp into a Stellar wallet. Create an account, check your balance, and send XLM, all from a chat, no app required."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SendAm" />
    <meta property="og:url" content="https://send-am-web.vercel.app/" />
    <meta property="og:title" content="SendAm | Send money like you send a text" />
    <meta
      property="og:description"
      content="WhatsApp-first payments powered by the Stellar network. Create a wallet and send XLM from a chat."
    />
    <meta
      property="og:image"
      content="https://send-am-web.vercel.app/social-preview.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SendAm logo on a light teal background" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SendAm | Send money like you send a text" />
    <meta
      name="twitter:description"
      content="WhatsApp-first payments powered by the Stellar network. Create a wallet and send XLM from a chat."
    />
    <meta
      name="twitter:image"
      content="https://send-am-web.vercel.app/social-preview.png"
    />
    <meta name="twitter:image:alt" content="SendAm logo on a light teal background" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fonts load without blocking first paint; system fonts render until Inter swaps in. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
