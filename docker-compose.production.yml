name: sendam-production

x-app: &app
  image: sendam-api:production
  build:
    context: .
    dockerfile: deploy/Dockerfile
  profiles: [app]
  env_file:
    - path: ${SENDAM_API_ENV_FILE:-./apps/api/.env}
      required: false
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  networks:
    - default
    - database

services:
  api:
    <<: *app
    ports:
      - '127.0.0.1:${SENDAM_API_PORT:-3002}:3002'
    environment:
      PORT: '3002'
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:3002/health/live").then(r => { if (!r.ok) process.exit(1) }, () => process.exit(1))']
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *app
    command: ['node', 'src/worker.js']

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sendam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the deployment secret store}
      POSTGRES_DB: ${POSTGRES_DB:-sendam}
      POSTGRES_INITDB_ARGS: --data-checksums --encoding=UTF8
    volumes:
      - sendam_postgres_data:/var/lib/postgresql/data
      - sendam_postgres_backups:/backups
    networks:
      - database
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    command:
      - postgres
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - log_min_duration_statement=${POSTGRES_LOG_MIN_DURATION_MS:-1000}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-256MB}
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-100}

networks:
  database:
    internal: true

volumes:
  sendam_postgres_data:
  sendam_postgres_backups:
