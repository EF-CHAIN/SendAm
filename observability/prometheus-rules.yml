groups:
  - name: sendam-production
    rules:
      - alert: SendAmApiDown
        expr: up{job="sendam-api"} == 0
        for: 2m
        labels:
          severity: critical
          service: sendam-api
        annotations:
          summary: SendAm API metrics target is down
          runbook_url: https://github.com/EF-CHAIN/SendAm/blob/main/docs/OBSERVABILITY.md#api-down

      - alert: SendAmWorkerDown
        expr: absent(up{job="sendam-worker"}) or up{job="sendam-worker"} == 0
        for: 2m
        labels:
          severity: critical
          service: sendam-worker
        annotations:
          summary: No SendAm worker metrics target is reachable
          runbook_url: https://github.com/EF-CHAIN/SendAm/blob/main/docs/OBSERVABILITY.md#worker-unhealthy

      - alert: SendAmWorkerNotReady
        expr: sendam_worker_ready == 0
        for: 2m
        labels:
          severity: critical
          service: sendam-worker
        annotations:
          summary: A SendAm worker has lost Redis, database, processor, or heartbeat readiness

      - alert: SendAmWorkerHeartbeatStale
        expr: time() - sendam_worker_last_heartbeat_timestamp_seconds > 90
        for: 1m
        labels:
          severity: critical
          service: sendam-worker
        annotations:
          summary: A SendAm worker heartbeat is stale

      - alert: SendAmQueueLagHigh
        expr: max by (queue) (sendam_queue_oldest_job_age_seconds) > 120
        for: 5m
        labels:
          severity: critical
          service: sendam-worker
        annotations:
          summary: A SendAm queue has been waiting for more than two minutes

      - alert: SendAmQueueStalled
        expr: sum by (queue) (increase(sendam_queue_stalled_jobs_total[10m])) > 0
        for: 1m
        labels:
          severity: warning
          service: sendam-worker
        annotations:
          summary: BullMQ reported a stalled SendAm job

      - alert: SendAmDepositSweepStale
        expr: sendam_deposit_sweep_age_seconds < 0 or sendam_deposit_sweep_age_seconds > 120
        for: 3m
        labels:
          severity: critical
          service: sendam-worker
        annotations:
          summary: The deposit sweep has not completed successfully

      - alert: SendAmHighHttpErrorRate
        expr: |
          sum(rate(sendam_http_requests_total{status_code=~"5.."}[5m]))
          /
          clamp_min(sum(rate(sendam_http_requests_total[5m])), 0.001)
          > 0.05
        for: 10m
        labels:
          severity: critical
          service: sendam-api
        annotations:
          summary: SendAm HTTP 5xx rate exceeds 5%
          runbook_url: https://github.com/EF-CHAIN/SendAm/blob/main/docs/OBSERVABILITY.md#high-http-error-rate

      - alert: SendAmHighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(sendam_http_request_duration_seconds_bucket[10m]))
          ) > 2
        for: 10m
        labels:
          severity: warning
          service: sendam-api
        annotations:
          summary: SendAm p95 HTTP latency exceeds 2 seconds

      - alert: SendAmUnhandledExceptions
        expr: sum(increase(sendam_exceptions_total[5m])) > 2
        for: 1m
        labels:
          severity: critical
          service: sendam-api
        annotations:
          summary: SendAm is reporting repeated exceptions
          runbook_url: https://github.com/EF-CHAIN/SendAm/blob/main/docs/OBSERVABILITY.md#exception-spike

      - alert: SendAmQueueFailures
        expr: sum(increase(sendam_queue_jobs_total{status="failed"}[10m])) > 5
        for: 5m
        labels:
          severity: critical
          service: sendam-worker
        annotations:
          summary: SendAm background jobs are repeatedly failing
          runbook_url: https://github.com/EF-CHAIN/SendAm/blob/main/docs/OBSERVABILITY.md#queue-failures

      - alert: SendAmDatabaseHealthDegraded
        expr: increase(sendam_health_checks_total{status="degraded"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
          service: sendam-api
        annotations:
          summary: SendAm database health checks are failing

      - alert: SendAmRedisDisconnected
        expr: sendam_redis_status == 0
        for: 2m
        labels:
          severity: critical
          service: sendam-redis
        annotations:
          summary: SendAm Redis is disconnected and work is being queued/buffered
          runbook_url: https://github.com/EF-CHAIN/SendAm/blob/main/docs/OBSERVABILITY.md#redis-disconnected

      - alert: SendAmRedisRecovery
        expr: increase(sendam_redis_disconnect_recovered_total[5m]) > 0
        for: 0m
        labels:
          severity: info
          service: sendam-redis
        annotations:
          summary: SendAm Redis has recovered after an outage

      - alert: SendAmRedisFailover
        expr: increase(sendam_redis_failovers_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
          service: sendam-redis
        annotations:
          summary: SendAm Redis failed over to a new master node

      - alert: SendAmRedisRetriesExhausted
        expr: increase(sendam_redis_retries_exhausted_total[10m]) > 0
        for: 1m
        labels:
          severity: critical
          service: sendam-redis
        annotations:
          summary: SendAm Redis reconnect budget exhausted; ensure Redis is reachable
          runbook_url: https://github.com/EF-CHAIN/SendAm/blob/main/docs/OBSERVABILITY.md#redis-disconnected

      - alert: SendAmQueueInlineFallback
        expr: increase(sendam_queue_inline_fallback_total[10m]) > 0
        for: 5m
        labels:
          severity: critical
          service: sendam-api
        annotations:
          summary: SendAm jobs are running inline instead of durably queued (Redis unavailable)

      - alert: SendAmQueueBacklogWarning
        expr: sum by (queue) (sendam_queue_backlog_size) > 50
        for: 5m
        labels:
          severity: warning
          service: sendam-worker
        annotations:
          summary: SendAm queue {{ $labels.queue }} backlog exceeds 50 jobs
          runbook_url: https://github.com/EF-CHAIN/SendAm/blob/main/docs/OBSERVABILITY.md#queue-backlog

      - alert: SendAmQueueBacklogCritical
        expr: sum by (queue) (sendam_queue_backlog_size) > 200
        for: 2m
        labels:
          severity: critical
          service: sendam-worker
        annotations:
          summary: SendAm queue {{ $labels.queue }} backlog exceeds critical threshold (200 jobs)
          runbook_url: https://github.com/EF-CHAIN/SendAm/blob/main/docs/OBSERVABILITY.md#queue-backlog

      - alert: SendAmQueueJobLagHigh
        expr: sum by (queue) (sendam_queue_lag_seconds) > 300
        for: 5m
        labels:
          severity: warning
          service: sendam-worker
        annotations:
          summary: SendAm queue {{ $labels.queue }} oldest job processing lag exceeds 5 minutes
          runbook_url: https://github.com/EF-CHAIN/SendAm/blob/main/docs/OBSERVABILITY.md#queue-lag

      - alert: SendAmDeadLetterQueueGrowing
        expr: sum(increase(sendam_dlq_moves_total[5m])) > 0
        for: 0m
        labels:
          severity: critical
          service: sendam-worker
        annotations:
          summary: SendAm dead-letter queue is receiving failed poison message jobs
          runbook_url: https://github.com/EF-CHAIN/SendAm/blob/main/docs/OBSERVABILITY.md#dead-letter-queue

      # ── Issue #228: Alert delivery tests ────────────────────────────────────

      - alert: SendAmAlertDeliveryTestFailed
        expr: increase(sendam_alert_delivery_test_overall_failure_total[15m]) > 0
        for: 1m
        labels:
          severity: critical
          service: sendam-api
        annotations:
          summary: SendAm alert delivery test failed — one or more alert routes could not be verified
          runbook_url: https://github.com/EF-CHAIN/SendAm/blob/main/docs/OBSERVABILITY.md#alert-delivery-test

      - alert: SendAmAlertDeliveryTestStale
        expr: sendam_alert_delivery_test_stale == 1
        for: 2m
        labels:
          severity: critical
          service: sendam-api
        annotations:
          summary: SendAm alert delivery tests have not run within the expected window — scheduler may be stopped
          runbook_url: https://github.com/EF-CHAIN/SendAm/blob/main/docs/OBSERVABILITY.md#alert-delivery-test

      - alert: SendAmAlertDeliveryFallbackUsed
        expr: increase(sendam_alert_delivery_test_fallback_total[30m]) > 0
        for: 0m
        labels:
          severity: warning
          service: sendam-api
        annotations:
          summary: SendAm alert delivery test fell back to secondary route — primary route may be degraded
